<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,Roboto,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1524"/><stop offset="1" stop-color="#0a1020"/></linearGradient>
    <radialGradient id="gl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6d40e0" stop-opacity=".28"/><stop offset="1" stop-color="#6d40e0" stop-opacity="0"/></radialGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/></filter>
    <style>
      .t{fill:#e7edf7}.m{fill:#9aa7bd}
      .tile{transform-box:view-box}
      @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      #c1,#c2,#c3,#c4,#c5,#c6,#c7,#c8{opacity:0;animation:rise .6s cubic-bezier(.2,.7,.3,1) forwards}
      #c1{animation-delay:.10s}#c2{animation-delay:.20s}#c3{animation-delay:.30s}#c4{animation-delay:.40s}
      #c5{animation-delay:.50s}#c6{animation-delay:.60s}#c7{animation-delay:.70s}#c8{animation-delay:.80s}
      @keyframes fadein{to{opacity:1}}
      #head{opacity:0;animation:fadein .5s ease forwards}
    </style>
  </defs>
  <rect width="920" height="340" rx="18" fill="url(#bg)"/>
  <ellipse cx="200" cy="30" rx="380" ry="150" fill="url(#gl)"/>

  <g id="head">
    <text x="30" y="46" class="t" font-size="22" font-weight="800">Mnestic <tspan class="m" font-weight="400" font-size="15">— your qbank, wired to AnKing</tspan></text>
    <text x="30" y="70" class="m" font-size="12.5">Every USMLE step · nothing to configure · one click between a question and your deck.</text>
  </g>

  <!-- row 1 -->
  <g id="c1" class="tile"><g filter="url(#s)"><rect x="30" y="92" width="206" height="112" rx="13" fill="#1b2333" stroke="#2c3850"/></g>
    <text x="48" y="128" font-size="22">📚</text><text x="48" y="156" class="t" font-size="14" font-weight="800">Resource overlays</text>
    <text x="48" y="177" class="m" font-size="11.5">First Aid · Sketchy · Physeo</text><text x="48" y="193" class="m" font-size="11.5">— one key, over the Q</text></g>

  <g id="c2" class="tile"><g filter="url(#s)"><rect x="252" y="92" width="206" height="112" rx="13" fill="#1b2333" stroke="#2c3850"/></g>
    <text x="270" y="128" font-size="22">📊</text><text x="270" y="156" class="t" font-size="14" font-weight="800">Weak areas</text>
    <text x="270" y="177" class="m" font-size="11.5">Block breakdown, weakest</text><text x="270" y="193" class="m" font-size="11.5">first · jump to missed</text></g>

  <g id="c3" class="tile"><g filter="url(#s)"><rect x="474" y="92" width="206" height="112" rx="13" fill="#1b2333" stroke="#2c3850"/></g>
    <text x="492" y="128" font-size="22">✚</text><text x="492" y="156" class="t" font-size="14" font-weight="800">Make cards</text>
    <text x="492" y="177" class="m" font-size="11.5">Cloze / Basic into Anki</text><text x="492" y="193" class="m" font-size="11.5">without leaving the page</text></g>

  <g id="c4" class="tile"><g filter="url(#s)"><rect x="696" y="92" width="194" height="112" rx="13" fill="#1b2333" stroke="#2c3850"/></g>
    <text x="714" y="128" font-size="22">★</text><text x="714" y="156" class="t" font-size="14" font-weight="800">Save to Missed</text>
    <text x="714" y="177" class="m" font-size="11.5">Keep the AnKing card the</text><text x="714" y="193" class="m" font-size="11.5">question maps to</text></g>

  <!-- row 2 -->
  <g id="c5" class="tile"><g filter="url(#s)"><rect x="30" y="216" width="206" height="112" rx="13" fill="#1b2333" stroke="#2c3850"/></g>
    <text x="48" y="252" font-size="22">📎</text><text x="48" y="280" class="t" font-size="14" font-weight="800">From-question images</text>
    <text x="48" y="301" class="m" font-size="11.5">Click only the images</text><text x="48" y="317" class="m" font-size="11.5">worth keeping</text></g>

  <g id="c6" class="tile"><g filter="url(#s)"><rect x="252" y="216" width="206" height="112" rx="13" fill="#1b2333" stroke="#2c3850"/></g>
    <text x="270" y="252" font-size="22">🤖</text><text x="270" y="280" class="t" font-size="14" font-weight="800">Copy for AI</text>
    <text x="270" y="301" class="m" font-size="11.5">Prompt presets → paste in</text><text x="270" y="317" class="m" font-size="11.5">any assistant</text></g>

  <g id="c7" class="tile"><g filter="url(#s)"><rect x="474" y="216" width="206" height="112" rx="13" fill="#1b2333" stroke="#2c3850"/></g>
    <text x="492" y="252" font-size="22">🔥</text><text x="492" y="280" class="t" font-size="14" font-weight="800">Study tracker</text>
    <text x="492" y="301" class="m" font-size="11.5">Streak, heatmap and a</text><text x="492" y="317" class="m" font-size="11.5">projected finish date</text></g>

  <g id="c8" class="tile"><g filter="url(#s)"><rect x="696" y="216" width="194" height="112" rx="13" fill="#1b2333" stroke="#2c3850"/></g>
    <text x="714" y="252" font-size="22">⌨️</text><text x="714" y="280" class="t" font-size="14" font-weight="800">Keyboard shortcuts</text>
    <text x="714" y="301" class="m" font-size="11.5">G · Q · V · D · ? — the whole</text><text x="714" y="317" class="m" font-size="11.5">flow, hands on keys</text></g>
</svg>
