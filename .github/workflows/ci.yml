name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: unit, add-on, listing, adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - name: unit tests, add-on guards and bridge security, store listing limits
        run: npm test
      # The browser must match the pinned playwright-core (package.json):
      # plain "npx playwright install" fetches the newest build instead.
      - name: site adapters (headless Chromium)
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:adapters

  e2e:
    # Loads the unpacked extension into a real (headed) Chromium against the
    # mock bridge, so it needs a display: xvfb provides one.
    name: end-to-end (real extension, mock bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright-core install --with-deps chromium
      - run: xvfb-run --auto-servernum npm run test:e2e
